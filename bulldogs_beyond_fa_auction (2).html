<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap');
.fa-app { font-family: 'Inter', sans-serif; background: #14171C; color: #F2F1ED; border-radius: 16px; padding: 0; overflow: hidden; max-width: 480px; margin: 0 auto; }
.fa-scoreboard { font-family: 'Anton', sans-serif; letter-spacing: 0.02em; }
.fa-btn { font-family: 'Inter', sans-serif; cursor: pointer; border: none; transition: transform 0.08s ease, background 0.15s ease; }
.fa-btn:active { transform: scale(0.97); }
.fa-input { font-family: 'Inter', sans-serif; box-sizing: border-box; }
.fa-tab { flex: 1; text-align: center; padding: 11px 4px; font-size: 12px; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; color: #6B6B66; }
.fa-tab.active { color: #F2F1ED; border-bottom-color: #D4A73C; }
</style>
<div class="fa-app" id="fa-root"></div>
<script>
(function(){

var STORAGE_KEY = "fa_auction_state_v4";
var BID_TIMER_SECONDS = 20;
var NOMINATE_TIMER_SECONDS = 30;
var BASE_ROSTER_LIMIT = 23;
var POLL_MS = 1500;
var FA_TEAM_NAME = "free agent";

var myTeam = null;
var activeTab = "auction";
var pollHandle = null;
var tickHandle = null;
var state = null;
var nomFilter = "";
var errorMsg = "";
var nextIdCounter = 1;

function posColor(pos) {
  var m = {QB:"#D4A73C", RB:"#3C8C5C", WR:"#4A8FD6", TE:"#B25FD6", K:"#8A8A85", DEF:"#C1443A"};
  return m[pos] || "#8A8A85";
}

function newId() { return "p" + (nextIdCounter++) + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,7); }

function emptyState() {
  return {
    leagueLoaded: false,
    draftStarted: false,
    teamOrder: [],
    teams: {},
    claimedTeams: {},
    availablePlayers: [],
    currentAuction: null,
    turnIndex: 0,
    turnDeadline: null,
    transactions: [],
    lastUpdated: Date.now()
  };
}

async function loadState() {
  try {
    var res = await window.storage.get(STORAGE_KEY, true);
    if (res && res.value) return JSON.parse(res.value);
  } catch (e) {}
  var fresh = emptyState();
  await saveState(fresh);
  return fresh;
}

async function saveState(s) {
  s.lastUpdated = Date.now();
  try { await window.storage.set(STORAGE_KEY, JSON.stringify(s), true); }
  catch (e) { console.error("save failed", e); }
}

function logTx(s, entry) {
  entry.ts = Date.now();
  s.transactions.unshift(entry);
}

function irCount(team) {
  return team.roster.filter(function(p){ return p.ir; }).length;
}

function teamLimit(team) {
  return BASE_ROSTER_LIMIT + irCount(team);
}

function openSlots(s, teamName) {
  var team = s.teams[teamName];
  return teamLimit(team) - team.roster.length;
}

function nextEligibleIndex(s, fromIndex) {
  var n = s.teamOrder.length;
  if (!n) return -1;
  for (var i = 0; i < n; i++) {
    var idx = (fromIndex + i) % n;
    if (openSlots(s, s.teamOrder[idx]) > 0) return idx;
  }
  return -1;
}

async function refresh() {
  state = await loadState();
  if (state.draftStarted) {
    await tickTurnLogic();
    await maybeFinalizeAuction();
  }
  render();
}

async function tickTurnLogic() {
  if (state.currentAuction) return;
  if (state.turnDeadline === null) {
    var idx = nextEligibleIndex(state, state.turnIndex);
    if (idx === -1) { state.turnDeadline = null; await saveState(state); return; }
    state.turnIndex = idx;
    state.turnDeadline = Date.now() + NOMINATE_TIMER_SECONDS * 1000;
    await saveState(state);
    return;
  }
  if (Date.now() >= state.turnDeadline) {
    var skippedTeam = state.teamOrder[state.turnIndex];
    logTx(state, {type:"skip", team: skippedTeam});
    var next = nextEligibleIndex(state, state.turnIndex + 1);
    if (next === -1) { state.turnDeadline = null; }
    else { state.turnIndex = next; state.turnDeadline = Date.now() + NOMINATE_TIMER_SECONDS * 1000; }
    await saveState(state);
  }
}

async function maybeFinalizeAuction() {
  if (!state.currentAuction) return;
  var now = Date.now();
  if (now >= state.currentAuction.timerEnd) {
    var a = state.currentAuction;
    var winner = a.currentBidder;
    var bid = a.currentBid;
    var years = bid >= 5 ? 3 : (bid >= 2 ? 2 : 1);
    if (winner && state.teams[winner] && openSlots(state, winner) > 0) {
      state.teams[winner].budget -= bid;
      state.teams[winner].roster.push({
        id: newId(), name: a.player.name, pos: a.player.pos, team: a.player.team, bye: a.player.bye,
        contractValue: bid, contractYears: years, yearsRemaining: years, ir: false
      });
      logTx(state, {type:"win", team: winner, player: a.player.name, pos: a.player.pos, bid: bid, years: years});
    } else {
      state.availablePlayers.push({name: a.player.name, pos: a.player.pos, team: a.player.team, bye: a.player.bye, sortValue: 0, cutAt: Date.now()});
      logTx(state, {type:"unsold", player: a.player.name, pos: a.player.pos});
    }
    state.currentAuction = null;
    var idx = nextEligibleIndex(state, state.turnIndex);
    if (idx === -1) { state.turnDeadline = null; }
    else { state.turnIndex = idx; state.turnDeadline = Date.now() + NOMINATE_TIMER_SECONDS * 1000; }
    await saveState(state);
  }
}

async function nominate(playerName, startBid) {
  state = await loadState();
  if (state.currentAuction) { flashError("An auction is already running"); return; }
  var turnTeam = state.teamOrder[state.turnIndex];
  if (myTeam !== turnTeam) { flashError("It's not your turn to nominate"); return; }
  if (openSlots(state, myTeam) <= 0) { flashError("Your roster is full"); return; }
  var team = state.teams[myTeam];
  if (isNaN(startBid) || startBid < 0 || startBid > team.budget) { flashError("Starting bid must be between $0 and $" + team.budget); return; }
  var pIdx = state.availablePlayers.findIndex(function(p){ return p.name === playerName; });
  if (pIdx === -1) { flashError("Player no longer available"); return; }
  var player = state.availablePlayers[pIdx];
  state.availablePlayers.splice(pIdx, 1);
  state.currentAuction = {
    player: player, currentBid: startBid, currentBidder: myTeam,
    timerEnd: Date.now() + BID_TIMER_SECONDS * 1000,
    bidHistory: [{team: myTeam, amount: startBid}]
  };
  logTx(state, {type:"nominate", team: myTeam, player: player.name, pos: player.pos, startBid: startBid});
  var idx = nextEligibleIndex(state, state.turnIndex + 1);
  state.turnIndex = idx === -1 ? state.turnIndex : idx;
  state.turnDeadline = null;
  render();
  await saveState(state);
}

async function placeBid(amount) {
  state = await loadState();
  if (!state.currentAuction) return;
  var a = state.currentAuction;
  if (Date.now() >= a.timerEnd) { await maybeFinalizeAuction(); render(); return; }
  if (isNaN(amount) || amount <= a.currentBid) { flashError("Bid must be higher than $" + a.currentBid); return; }
  if (openSlots(state, myTeam) <= 0) { flashError("Your roster is full \u2014 cut someone first"); return; }
  var team = state.teams[myTeam];
  if (amount > team.budget) { flashError("Bid exceeds your remaining cap ($" + team.budget + ")"); return; }
  if (myTeam === a.currentBidder) { flashError("You're already the high bidder"); return; }
  a.currentBid = amount;
  a.currentBidder = myTeam;
  a.timerEnd = Date.now() + BID_TIMER_SECONDS * 1000;
  a.bidHistory.unshift({team: myTeam, amount: amount});
  logTx(state, {type:"bid", team: myTeam, player: a.player.name, amount: amount});
  render();
  await saveState(state);
}

async function cutPlayer(playerId) {
  state = await loadState();
  var team = state.teams[myTeam];
  if (!team) return;
  var idx = -1;
  for (var i = 0; i < team.roster.length; i++) {
    if (team.roster[i].id === playerId) { idx = i; break; }
  }
  if (idx === -1) { flashError("Couldn't find that player on your roster"); return; }
  var p = team.roster[idx];
  team.roster.splice(idx, 1);
  team.budget += p.contractValue;
  state.availablePlayers.unshift({name: p.name, pos: p.pos, team: p.team, bye: p.bye, sortValue: 0, cutAt: Date.now()});
  logTx(state, {type:"cut", team: myTeam, player: p.name, pos: p.pos, capFreed: p.contractValue});
  render();
  await saveState(state);
}

function flashError(msg) {
  errorMsg = msg;
  render();
  setTimeout(function(){ errorMsg = ""; render(); }, 2500);
}

function startPolling() {
  if (pollHandle) clearInterval(pollHandle);
  pollHandle = setInterval(refresh, POLL_MS);
  if (tickHandle) clearInterval(tickHandle);
  tickHandle = setInterval(function(){
    if (!state || !state.draftStarted) return;
    if (state.currentAuction) { maybeFinalizeAuction().then(renderTimerOnly); }
    else { tickTurnLogic().then(renderTimerOnly); }
  }, 250);
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML;
}

function fmtSecs(ms) { return Math.max(0, Math.ceil(ms/1000)); }

function renderTimerOnly() {
  if (!state) return;
  var ring = document.getElementById('fa-timer-ring-text');
  var bar = document.getElementById('fa-timer-bar');
  if (state.currentAuction && ring) {
    var remaining = state.currentAuction.timerEnd - Date.now();
    var secs = fmtSecs(remaining);
    ring.textContent = secs;
    if (bar) {
      var pct = Math.max(0, Math.min(100, (remaining/(BID_TIMER_SECONDS*1000))*100));
      bar.style.width = pct + "%";
      bar.style.background = secs <= 3 ? "#C1443A" : "#3C8C5C";
    }
  } else {
    var nomRing = document.getElementById('fa-nom-timer-text');
    if (nomRing && state.turnDeadline) nomRing.textContent = fmtSecs(state.turnDeadline - Date.now());
  }
}

function render() {
  var root = document.getElementById('fa-root');
  if (!state) { root.innerHTML = ""; return; }
  if (!state.leagueLoaded) { renderUpload(root); return; }
  if (!state.draftStarted) { renderReadyScreen(root); return; }
  if (!myTeam) { renderTeamSelect(root); return; }
  renderMain(root);
}

function renderUpload(root) {
  var html = '<div style="padding:2.2rem 1.5rem;text-align:center;">';
  html += '<div class="fa-scoreboard" style="font-size:12px;letter-spacing:0.15em;color:#D4A73C;margin-bottom:6px;">BULLDOGS & BEYOND</div>';
  html += '<div class="fa-scoreboard" style="font-size:26px;line-height:1.15;margin-bottom:10px;">UPLOAD LEAGUE FILE</div>';
  html += '<div style="font-size:13px;color:#9A9A94;margin-bottom:6px;">CSV columns, in order:</div>';
  html += '<div style="font-size:11px;color:#6B6B66;font-family:monospace;margin-bottom:22px;">Team, Player, Position, NFL Team, Bye, Contract value, Years remaining, IR</div>';
  html += '<div style="font-size:12px;color:#9A9A94;margin-bottom:22px;">Rows with Team = "Free Agent" populate the auction pool. Everyone else\'s rows build that team\'s roster.</div>';
  html += '<label class="fa-btn" style="display:inline-block;background:#3C8C5C;color:#fff;font-size:14px;font-weight:600;padding:12px 24px;border-radius:10px;">Choose CSV file<input type="file" accept=".csv" onchange="window.__faCsvUpload(event)" style="display:none;"></label>';
  html += '</div>';
  root.innerHTML = html;
}

function renderReadyScreen(root) {
  var teamCount = state.teamOrder.length;
  var faCount = state.availablePlayers.length;
  var html = '<div style="padding:2.2rem 1.5rem;text-align:center;">';
  html += '<div class="fa-scoreboard" style="font-size:12px;letter-spacing:0.15em;color:#D4A73C;margin-bottom:6px;">BULLDOGS & BEYOND</div>';
  html += '<div class="fa-scoreboard" style="font-size:26px;line-height:1.15;margin-bottom:14px;">LEAGUE LOADED</div>';
  html += '<div style="background:#1D2127;border:1px solid #2A2F37;border-radius:10px;padding:14px;margin-bottom:22px;text-align:left;">';
  html += '<div style="font-size:13px;color:#9A9A94;display:flex;justify-content:space-between;padding:4px 0;"><span>Teams</span><span style="color:#F2F1ED;font-weight:600;">' + teamCount + '</span></div>';
  html += '<div style="font-size:13px;color:#9A9A94;display:flex;justify-content:space-between;padding:4px 0;"><span>Free agents in pool</span><span style="color:#F2F1ED;font-weight:600;">' + faCount + '</span></div>';
  html += '</div>';
  html += '<button class="fa-btn" onclick="window.__faStartDraft()" style="background:#D4A73C;color:#14171C;font-size:15px;font-weight:700;padding:13px 28px;border-radius:10px;">Start draft</button>';
  html += '<div style="margin-top:18px;">';
  html += '<label class="fa-btn" style="display:inline-block;background:none;border:1px solid #2A2F37;color:#9A9A94;font-size:12px;padding:8px 14px;border-radius:8px;">Re-upload CSV<input type="file" accept=".csv" onchange="window.__faCsvUpload(event)" style="display:none;"></label>';
  html += '</div></div>';
  root.innerHTML = html;
}

function renderTeamSelect(root) {
  var html = '';
  html += '<div style="padding:2.2rem 1.5rem;text-align:center;">';
  html += '<div class="fa-scoreboard" style="font-size:12px;letter-spacing:0.15em;color:#D4A73C;margin-bottom:6px;">BULLDOGS & BEYOND</div>';
  html += '<div class="fa-scoreboard" style="font-size:26px;line-height:1.1;margin-bottom:6px;">SELECT YOUR TEAM</div>';
  html += '<div style="font-size:13px;color:#9A9A94;margin-bottom:22px;">Tap your team to enter the auction room</div>';
  html += '<div style="display:flex;flex-direction:column;gap:8px;max-width:380px;margin:0 auto;">';
  state.teamOrder.forEach(function(name){
    var t = state.teams[name];
    var claimed = !!state.claimedTeams[name];
    html += '<button class="fa-btn" onclick="window.__faSelectTeam(\'' + esc(name).replace(/'/g,"\\'") + '\')" style="background:#1D2127;border:1px solid ' + (claimed?'#3C3A2E':'#2A2F37') + ';border-radius:10px;padding:14px 16px;text-align:left;color:#F2F1ED;display:flex;justify-content:space-between;align-items:center;">';
    html += '<span style="font-size:15px;font-weight:600;">' + esc(name) + (claimed ? ' <span style="font-size:10px;color:#D4A73C;font-weight:600;background:#3C3A2E;padding:2px 6px;border-radius:4px;margin-left:6px;">IN USE</span>' : '') + '</span>';
    html += '<span style="text-align:right;"><span style="font-size:14px;color:#3C8C5C;font-weight:600;">$' + t.budget + '</span><span style="font-size:11px;color:#6B6B66;display:block;">' + t.roster.length + '/' + teamLimit(t) + ' roster</span></span>';
    html += '</button>';
  });
  html += '</div></div>';
  root.innerHTML = html;
}

function renderMain(root) {
  var team = state.teams[myTeam];
  var html = '';

  html += '<div style="padding:14px 16px;border-bottom:1px solid #2A2F37;display:flex;justify-content:space-between;align-items:center;">';
  html += '<div><div class="fa-scoreboard" style="font-size:10px;letter-spacing:0.1em;color:#D4A73C;">BULLDOGS & BEYOND</div><div style="font-size:14px;font-weight:600;">' + esc(myTeam) + '</div></div>';
  html += '<div style="text-align:right;"><div style="font-size:10px;color:#9A9A94;">CAP / ROSTER</div><div class="fa-scoreboard" style="font-size:18px;color:#3C8C5C;">$' + team.budget + ' &middot; ' + team.roster.length + '/' + teamLimit(team) + '</div></div>';
  html += '</div>';

  html += '<div style="display:flex;border-bottom:1px solid #2A2F37;">';
  [["auction","Auction"],["roster","My Roster"],["teams","All Teams"],["history","Transactions"]].forEach(function(t){
    html += '<div class="fa-tab' + (activeTab===t[0]?' active':'') + '" onclick="window.__faTab(\'' + t[0] + '\')">' + t[1] + '</div>';
  });
  html += '</div>';

  if (errorMsg) {
    html += '<div style="background:#3A1E1E;color:#F09595;padding:8px 16px;font-size:12px;">' + esc(errorMsg) + '</div>';
  }

  html += '<div style="padding:16px;min-height:200px;">';
  if (activeTab === "auction") html += renderAuctionTab();
  else if (activeTab === "roster") html += renderRosterTab();
  else if (activeTab === "teams") html += renderTeamsTab();
  else if (activeTab === "history") html += renderHistoryTab();
  html += '</div>';

  html += '<div style="padding:10px 16px;text-align:center;border-top:1px solid #2A2F37;"><button class="fa-btn" onclick="window.__faSwitchTeam()" style="background:none;border:none;color:#6B6B66;font-size:12px;text-decoration:underline;">switch team</button></div>';

  root.innerHTML = html;
  renderTimerOnly();
}

function renderAuctionTab() {
  if (state.currentAuction) return renderAuctionBlock();
  var turnTeam = state.teamOrder[state.turnIndex];
  var isMyTurn = turnTeam === myTeam;
  var html = '';
  if (state.turnDeadline === null) {
    html += '<div style="text-align:center;padding:20px 0;color:#9A9A94;font-size:13px;">All rosters are full. The FA auction is complete.</div>';
    return html;
  }
  html += '<div style="background:#1D2127;border:1px solid #2A2F37;border-radius:10px;padding:14px;text-align:center;margin-bottom:14px;">';
  html += '<div style="font-size:11px;color:#9A9A94;">' + (isMyTurn ? "YOUR TURN TO NOMINATE" : "WAITING ON") + '</div>';
  html += '<div class="fa-scoreboard" style="font-size:20px;color:' + (isMyTurn?'#3C8C5C':'#F2F1ED') + ';">' + esc(turnTeam) + (isMyTurn ? ' (you)' : '') + '</div>';
  html += '<div style="font-size:12px;color:#6B6B66;margin-top:2px;"><span id="fa-nom-timer-text">' + fmtSecs(state.turnDeadline - Date.now()) + '</span>s to nominate</div>';
  html += '</div>';
  if (!isMyTurn) {
    html += '<div style="text-align:center;color:#6B6B66;font-size:12px;padding:8px 0 16px;">Only ' + esc(turnTeam) + ' can nominate right now. Browse available players below.</div>';
  }
  html += renderPlayerBrowser(isMyTurn);
  return html;
}

function renderAuctionBlock() {
  var a = state.currentAuction;
  var remaining = a.timerEnd - Date.now();
  var secs = fmtSecs(remaining);
  var team = state.teams[myTeam];
  var mySlotsOpen = openSlots(state, myTeam) > 0;
  var quickBids = [a.currentBid+1, a.currentBid+3, a.currentBid+5].filter(function(b){ return b <= team.budget; });

  var html = '<div style="background:#1D2127;border:1px solid #2A2F37;border-radius:12px;padding:18px;">';
  html += '<div style="display:flex;justify-content:space-between;align-items:flex-start;">';
  html += '<div>';
  html += '<div style="display:inline-block;background:' + posColor(a.player.pos) + '22;color:' + posColor(a.player.pos) + ';font-size:11px;font-weight:600;padding:3px 8px;border-radius:5px;margin-bottom:8px;">' + esc(a.player.pos) + ' &middot; ' + esc(a.player.team) + (a.player.bye ? ' &middot; bye ' + esc(a.player.bye) : '') + '</div>';
  html += '<div class="fa-scoreboard" style="font-size:23px;line-height:1.15;">' + esc(a.player.name) + '</div>';
  html += '</div>';
  html += '<div style="text-align:center;flex-shrink:0;margin-left:12px;">';
  html += '<div id="fa-timer-ring-text" class="fa-scoreboard" style="font-size:28px;color:' + (secs<=3 ? '#E24B4A' : '#F2F1ED') + ';">' + secs + '</div>';
  html += '<div style="font-size:10px;color:#6B6B66;">SECONDS</div>';
  html += '</div></div>';

  html += '<div style="height:4px;background:#2A2F37;border-radius:2px;margin:14px 0;overflow:hidden;">';
  html += '<div id="fa-timer-bar" style="height:100%;background:#3C8C5C;width:100%;transition:width 0.2s linear;"></div></div>';

  html += '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px;">';
  html += '<div><div style="font-size:11px;color:#9A9A94;">CURRENT BID</div><div class="fa-scoreboard" style="font-size:32px;color:#D4A73C;">$' + a.currentBid + '</div></div>';
  html += '<div style="text-align:right;"><div style="font-size:11px;color:#9A9A94;">HIGH BIDDER</div><div style="font-size:15px;font-weight:600;color:' + (a.currentBidder===myTeam?'#3C8C5C':'#F2F1ED') + ';">' + esc(a.currentBidder) + (a.currentBidder===myTeam ? ' (you)' : '') + '</div></div></div>';

  if (!mySlotsOpen) {
    html += '<div style="color:#E2A0A0;font-size:12px;">Your roster is full. Cut a player from My Roster to bid.</div>';
  } else if (a.currentBidder !== myTeam) {
    html += '<div style="display:flex;gap:8px;flex-wrap:wrap;">';
    quickBids.forEach(function(b){
      html += '<button class="fa-btn" onclick="window.__faBid(' + b + ')" style="background:#2A2F37;color:#F2F1ED;padding:9px 14px;border-radius:8px;font-size:14px;font-weight:600;">$' + b + '</button>';
    });
    html += '<div style="display:flex;gap:6px;align-items:center;flex:1;min-width:150px;">';
    html += '<input class="fa-input" id="fa-custom-bid" type="number" min="' + (a.currentBid+1) + '" max="' + team.budget + '" placeholder="Custom" style="width:100%;background:#14171C;border:1px solid #2A2F37;color:#F2F1ED;border-radius:8px;padding:9px 10px;font-size:14px;">';
    html += '<button class="fa-btn" onclick="window.__faCustomBid()" style="background:#3C8C5C;color:#fff;padding:9px 14px;border-radius:8px;font-size:13px;font-weight:600;flex-shrink:0;">Bid</button></div></div>';
  } else {
    html += '<div style="color:#3C8C5C;font-size:13px;">You\'re the high bidder &mdash; sit tight.</div>';
  }
  html += '</div>';
  html += '<div style="margin-top:14px;font-size:12px;color:#6B6B66;">Need to cut someone to free cap or a roster spot? <span style="color:#9A9A94;text-decoration:underline;cursor:pointer;" onclick="window.__faTab(\'roster\')">Go to My Roster</span></div>';
  return html;
}

function comparePlayers(a, b) {
  var aCut = a.cutAt != null, bCut = b.cutAt != null;
  if (aCut && !bCut) return -1;
  if (!aCut && bCut) return 1;
  if (aCut && bCut) return b.cutAt - a.cutAt;
  return (b.sortValue||0) - (a.sortValue||0);
}

function renderPlayerBrowser(showNominate) {
  var pool = state.availablePlayers.filter(function(p){
    return !nomFilter || p.name.toLowerCase().indexOf(nomFilter.toLowerCase()) !== -1 || p.pos.toLowerCase() === nomFilter.toLowerCase();
  }).slice().sort(comparePlayers).slice(0, 60);

  var html = '<input class="fa-input" id="fa-nom-search" type="text" placeholder="Search available players..." value="' + esc(nomFilter) + '" oninput="window.__faFilter(this.value)" style="width:100%;background:#1D2127;border:1px solid #2A2F37;color:#F2F1ED;border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:10px;">';

  if (showNominate) {
    var team = state.teams[myTeam];
    html += '<div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;">';
    html += '<input class="fa-input" id="fa-start-bid" type="number" min="0" max="' + team.budget + '" placeholder="Starting bid $0-$' + team.budget + '" style="flex:1;background:#1D2127;border:1px solid #2A2F37;color:#F2F1ED;border-radius:8px;padding:9px 10px;font-size:13px;">';
    html += '</div>';
  }

  html += '<div style="max-height:320px;overflow-y:auto;">';
  pool.forEach(function(p){
    html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 2px;border-bottom:1px solid #21252B;">';
    html += '<div><span style="font-size:14px;">' + esc(p.name) + '</span> <span style="font-size:11px;color:' + posColor(p.pos) + ';margin-left:6px;">' + esc(p.pos) + '</span> <span style="font-size:11px;color:#6B6B66;">' + esc(p.team) + (p.bye ? ' &middot; bye ' + esc(p.bye) : '') + '</span>' + (p.cutAt ? ' <span style="font-size:10px;color:#E2A0A0;">cut</span>' : '') + '</div>';
    if (showNominate) {
      html += '<button class="fa-btn" onclick="window.__faNominate(\'' + esc(p.name).replace(/'/g,"\\'") + '\')" style="background:#2A2F37;color:#F2F1ED;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:600;flex-shrink:0;">Nominate</button>';
    }
    html += '</div>';
  });
  if (!pool.length) html += '<div style="color:#6B6B66;font-size:13px;padding:12px 0;">No players match.</div>';
  html += '</div>';
  return html;
}

function renderRosterTab() {
  var team = state.teams[myTeam];
  var html = '<div style="display:flex;justify-content:space-between;font-size:12px;color:#9A9A94;margin-bottom:10px;">';
  html += '<span>' + team.roster.length + ' / ' + teamLimit(team) + ' roster spots used (23 + ' + irCount(team) + ' IR)</span></div>';
  html += '<div style="font-size:12px;color:#9A9A94;margin-bottom:10px;">$' + team.budget + ' cap room</div>';
  html += '<div>';
  var sorted = team.roster.slice().sort(function(a,b){ return b.contractValue - a.contractValue; });
  sorted.forEach(function(p){
    html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 2px;border-bottom:1px solid #21252B;">';
    html += '<div><span style="font-size:14px;">' + esc(p.name) + '</span> <span style="font-size:11px;color:' + posColor(p.pos) + ';margin-left:6px;">' + esc(p.pos) + '</span>' + (p.ir ? ' <span style="font-size:10px;color:#C1443A;background:#3A1E1E;padding:2px 5px;border-radius:4px;margin-left:4px;">IR</span>' : '') + '';
    html += '<div style="font-size:11px;color:#6B6B66;margin-top:2px;">$' + p.contractValue + ' cap hit &middot; ' + p.yearsRemaining + 'yr remaining</div></div>';
    html += '<button class="fa-btn" data-id="' + esc(p.id) + '" onclick="window.__faCut(this.getAttribute(\'data-id\'))" style="background:#3A1E1E;color:#F09595;padding:7px 12px;border-radius:6px;font-size:12px;font-weight:600;flex-shrink:0;">Cut</button>';
    html += '</div>';
  });
  if (!team.roster.length) html += '<div style="color:#6B6B66;font-size:13px;padding:12px 0;">No players rostered.</div>';
  html += '</div>';
  return html;
}

function renderTeamsTab() {
  var html = '<div>';
  var names = state.teamOrder.slice().sort(function(a,b){ return state.teams[b].budget - state.teams[a].budget; });
  names.forEach(function(name){
    var t = state.teams[name];
    var isMe = name === myTeam;
    html += '<div style="background:' + (isMe?'#1F2E22':'#1D2127') + ';border:1px solid ' + (isMe?'#3C8C5C':'#2A2F37') + ';border-radius:8px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;">';
    html += '<span style="font-size:14px;font-weight:' + (isMe?'700':'500') + ';">' + esc(name) + '</span>';
    html += '<span style="text-align:right;"><span style="font-size:15px;font-weight:600;color:' + (t.budget<10?'#E2A0A0':'#3C8C5C') + ';">$' + t.budget + '</span><span style="font-size:11px;color:#6B6B66;display:block;">' + t.roster.length + '/' + teamLimit(t) + '</span></span>';
    html += '</div>';
  });
  html += '</div>';
  return html;
}

function renderHistoryTab() {
  var html = '<div style="max-height:420px;overflow-y:auto;">';
  if (!state.transactions.length) html += '<div style="color:#6B6B66;font-size:13px;">No transactions yet.</div>';
  state.transactions.forEach(function(tx){
    var line = "", color = "#F2F1ED";
    if (tx.type === "win") { line = esc(tx.team) + ' won ' + esc(tx.player) + ' (' + esc(tx.pos) + ') for $' + tx.bid + ' \u00b7 ' + tx.years + 'yr'; color = "#D4A73C"; }
    else if (tx.type === "nominate") { line = esc(tx.team) + ' nominated ' + esc(tx.player) + ' at $' + tx.startBid; color = "#4A8FD6"; }
    else if (tx.type === "bid") { line = esc(tx.team) + ' bid $' + tx.amount + ' on ' + esc(tx.player); }
    else if (tx.type === "cut") { line = esc(tx.team) + ' cut ' + esc(tx.player) + ' \u2014 $' + tx.capFreed + ' freed'; color = "#E24B4A"; }
    else if (tx.type === "skip") { line = esc(tx.team) + ' skipped (no nomination in time)'; color = "#6B6B66"; }
    else if (tx.type === "unsold") { line = esc(tx.player) + ' went unsold'; color = "#6B6B66"; }
    else if (tx.type === "system") { line = esc(tx.detail); color = "#6B6B66"; }
    var d = new Date(tx.ts);
    var timeStr = d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    html += '<div style="padding:8px 2px;border-bottom:1px solid #21252B;font-size:13px;color:' + color + ';">' + line + '<div style="font-size:10px;color:#6B6B66;">' + timeStr + '</div></div>';
  });
  html += '</div>';
  return html;
}

function parseCsv(text) {
  var lines = text.split(/\r?\n/).filter(function(l){ return l.trim().length; });
  if (lines.length < 2) return null;
  var headers = lines[0].split(',').map(function(h){ return h.trim().toLowerCase().replace(/\s+/g,''); });
  var idx = {
    team: headers.indexOf('team'), player: headers.indexOf('player'),
    pos: headers.indexOf('position'), nflteam: headers.indexOf('nflteam'),
    bye: headers.indexOf('bye'), value: headers.indexOf('contractvalue'),
    yrs: headers.indexOf('yearsremaining'), ir: headers.indexOf('ir')
  };
  if (idx.team === -1 || idx.player === -1) return null;

  var teamsObj = {};
  var teamOrder = [];
  var availablePlayers = [];

  for (var i = 1; i < lines.length; i++) {
    var cols = lines[i].split(',').map(function(c){ return c.trim(); });
    var teamRaw = cols[idx.team];
    if (!teamRaw) continue;
    var name = cols[idx.player];
    var pos = idx.pos > -1 ? cols[idx.pos].toUpperCase() : "";
    var nflTeam = idx.nflteam > -1 ? cols[idx.nflteam] : "";
    var bye = idx.bye > -1 ? parseInt(cols[idx.bye],10) || null : null;
    var val = idx.value > -1 ? (parseFloat(cols[idx.value]) || 0) : 0;
    var yrs = idx.yrs > -1 ? (parseInt(cols[idx.yrs],10) || 0) : 0;
    var irYes = idx.ir > -1 ? /^y/i.test(cols[idx.ir]) : false;

    if (teamRaw.trim().toLowerCase() === FA_TEAM_NAME) {
      availablePlayers.push({name: name, pos: pos, team: nflTeam, bye: bye, sortValue: val, cutAt: null});
      continue;
    }
    if (!teamsObj[teamRaw]) {
      teamsObj[teamRaw] = { budget: 200, roster: [] };
      teamOrder.push(teamRaw);
    }
    teamsObj[teamRaw].roster.push({
      id: newId(), name: name, pos: pos, team: nflTeam, bye: bye,
      contractValue: val, contractYears: yrs, yearsRemaining: yrs, ir: irYes
    });
  }

  teamOrder.forEach(function(name){
    var spent = teamsObj[name].roster.reduce(function(s,p){ return s + p.contractValue; }, 0);
    teamsObj[name].budget = 200 - spent;
  });

  return { teamOrder: teamOrder, teams: teamsObj, availablePlayers: availablePlayers };
}

window.__faCsvUpload = function(ev) {
  var file = ev.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = async function(e) {
    var parsed = parseCsv(e.target.result);
    if (!parsed) {
      alert("Couldn't read that file. Expected header row: Team,Player,Position,NFL Team,Bye,Contract value,Years remaining,IR");
      return;
    }
    var fresh = emptyState();
    fresh.leagueLoaded = true;
    fresh.teamOrder = parsed.teamOrder;
    fresh.teams = parsed.teams;
    fresh.claimedTeams = {};
    fresh.availablePlayers = parsed.availablePlayers;
    fresh.transactions = [{type:"system", detail:"League data loaded from CSV \u2014 " + parsed.teamOrder.length + " teams, " + parsed.availablePlayers.length + " free agents"}];
    state = fresh;
    myTeam = null;
    await saveState(state);
    render();
  };
  reader.readAsText(file);
};

window.__faStartDraft = async function() {
  state = await loadState();
  state.draftStarted = true;
  state.turnIndex = 0;
  state.turnDeadline = Date.now() + NOMINATE_TIMER_SECONDS * 1000;
  logTx(state, {type:"system", detail:"Draft started"});
  await saveState(state);
  render();
};

window.__faSelectTeam = async function(name) {
  myTeam = name;
  state = await loadState();
  state.claimedTeams[name] = true;
  await saveState(state);
  render();
  startPolling();
};
window.__faSwitchTeam = function() { myTeam = null; render(); };
window.__faTab = function(t) { activeTab = t; render(); };
window.__faFilter = function(v) {
  nomFilter = v; render();
  var el = document.getElementById('fa-nom-search');
  if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
};
window.__faNominate = async function(name) {
  var bidEl = document.getElementById('fa-start-bid');
  var bid = bidEl && bidEl.value !== "" ? parseInt(bidEl.value, 10) : 0;
  if (isNaN(bid)) bid = 0;
  await nominate(name, bid);
};
window.__faBid = async function(amount) { await placeBid(amount); };
window.__faCustomBid = async function() {
  var el = document.getElementById('fa-custom-bid');
  var v = parseInt(el.value, 10);
  if (isNaN(v)) { flashError("Enter a bid amount first"); return; }
  await placeBid(v);
};
window.__faCut = async function(playerId) {
  if (!playerId) return;
  await cutPlayer(playerId);
};

(async function init(){
  state = await loadState();
  render();
  startPolling();
})();

})();
</script>
